# ============================================================================
# Deploy the Worker on every push to main.
# ----------------------------------------------------------------------------
# Two jobs on purpose: the site goes live only if the suites pass first, and
# what CI runs is the same command you run locally against the same stand-in —
# no mocks of the Worker, no reduced check list.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN    "Edit Cloudflare Workers" API token
#   CLOUDFLARE_ACCOUNT_ID   account id, shown by `npx wrangler whoami`
#
# Secrets stored on the Worker (MEDIA_SIGNING_KEY, STATS_TOKEN, B2_KEY_ID,
# B2_APPLICATION_KEY) are NOT touched by this workflow: they live in Cloudflare
# and survive a deploy. See docs/DEPLOY.md.
# ============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite backs the D1 stand-in, so this must be 22.5+.
          node-version: "24"

      - name: Worker and signing suites
        run: |
          set -euo pipefail

          # The suite drives the real Worker against the real B2 stand-in, so it
          # needs a seeded ladder. The fixture is synthetic (playlist structure
          # and object keys are what the checks depend on) which keeps ffmpeg and
          # multi-megabyte media out of CI.
          node tools/test-fixture.mjs "$RUNNER_TEMP/hls"
          node tools/b2-stand-in.mjs 8090 "$RUNNER_TEMP/hls" &
          echo $! > "$RUNNER_TEMP/sim.pid"

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8090/_dump; then break; fi
            sleep 0.5
          done
          # Fail loudly rather than letting every media check fail with a
          # confusing message when the stand-in never came up.
          curl -fsS -o /dev/null http://127.0.0.1:8090/_dump

          # pipefail, so a failing suite fails the step even though tee succeeds.
          node worker/b2-cdn-worker.test.mjs 2>&1 | tee "$RUNNER_TEMP/worker-suite.log"
          node tools/sigv4.test.mjs 2>&1 | tee "$RUNNER_TEMP/sigv4-suite.log"

          kill "$(cat "$RUNNER_TEMP/sim.pid")" || true

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::No CLOUDFLARE_API_TOKEN secret. Create one at dash.cloudflare.com (My Profile -> API Tokens -> Edit Cloudflare Workers) and add it, plus CLOUDFLARE_ACCOUNT_ID, under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npx --yes wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          echo "---"
          grep -E "^  https://|custom domain" "$RUNNER_TEMP/deploy.log" || true
