# ============================================================================
# ESMERINGHOY — CDN WORKER + STATISTICS + STATIC SITE
# ----------------------------------------------------------------------------
# Deploy:  npx wrangler deploy        (full walkthrough: docs/DEPLOY.md)
# Local:   npx wrangler dev           (serves everything on :8787)
#
# One Worker serves the whole site: the static files ride along as assets, and
# /token, /track, /stats and signed media paths are handled in code.
# .assetsignore keeps tests, docs and tools out of the upload.

name = "esmeringhoy"
main = "worker/b2-cdn-worker.js"
compatibility_date = "2026-10-10"

# One canonical origin. With routes present wrangler disables workers.dev by
# default; saying so outright keeps it that way and stops the warning. Set this
# to true, or add the origin below, if the workers.dev URL is ever wanted back.
workers_dev = false

# Custom domain, and it has to stay ABOVE [vars]: in TOML a key written after a
# table header belongs to that table, and inside [vars] these lines silently
# become env.routes — a variable passed to the Worker — instead of triggers.
# Cloudflare creates the DNS records and the certificate from these two lines,
# so nothing is ever added by hand in the DNS tab, and a hand-made CNAME on
# either hostname would block the custom domain outright.
routes = [
  { pattern = "esmeringhoy.eu.cc", custom_domain = true },
  { pattern = "www.esmeringhoy.eu.cc", custom_domain = true }
]

[assets]
directory = "."
binding = "ASSETS"
# The pages are linked by name (player.html?id=..., admin.html, index.html). The
# default "auto-trailing-slash" answers every one of those with a 307 to the
# extensionless path — an extra round trip on each navigation, and a hard stop
# for any client that does not follow redirects. "none" serves the named file.
html_handling = "none"
# "none" (the default) also matters for the API: a path that is not an asset
# must reach the Worker, because that is where /token, /track, /stats and the
# signed media routes live. An SPA fallback would swallow them.

[vars]
# Origins allowed to call /token, /track and /stats (comma-separated).
# Every origin the site is actually browsed from has to be here — a missing
# entry is the usual reason a player loads and then refuses to sign anything.
SITE_ORIGINS = "https://esmeringhoy.eu.cc,https://www.esmeringhoy.eu.cc"

# Optional tuning (defaults shown):
# TOKEN_TTL = "21600"     # seconds a signed URL stays valid
# CACHE_TTL = "86400"     # edge cache seconds for segments
# TRACKING  = "on"        # "off" disables view recording entirely

[[d1_databases]]
binding = "DB"
database_name = "esh-stats"
database_id = "a11a12a5-e9a2-49c3-a144-334f2f7cc0b6"

# Secrets — never put these in this file:
#   npx wrangler secret put B2_KEY_ID           (Backblaze key ID)
#   npx wrangler secret put B2_APPLICATION_KEY  (Backblaze application key)
#   npx wrangler secret put MEDIA_SIGNING_KEY   (openssl rand -hex 32)
#   npx wrangler secret put STATS_TOKEN         (openssl rand -hex 24)
# BUCKET_NAME goes under [vars] — it is not secret.
